<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QQ Agent 启动恢复</title><style>
:root{color-scheme:light dark;font:14px/1.7 system-ui,sans-serif}body{margin:32px;max-width:760px}h1{font-size:21px;font-weight:600}button{font:inherit;margin:0 8px 8px 0;padding:4px 12px}dl{display:grid;grid-template-columns:100px 1fr;gap:4px 12px}dt,dd{margin:0}#workspace{overflow-wrap:anywhere}small{color:GrayText}
</style></head><body><main><h1>NapCat 尚未启动</h1><p>准备运行组件后启动机器人。服务就绪后将自动打开 NapCat 原版 WebUI，登录和插件设置都在原版界面中操作。</p><p><button data-action="install">准备运行组件</button><button data-action="start">启动机器人</button><button data-action="home">重新检查</button></p><dl><dt>QQ 状态</dt><dd id="qq">检查中…</dd><dt>机器人</dt><dd id="bot">检查中…</dd><dt>模型</dt><dd id="model">尚未读取</dd><dt>工作区</dt><dd id="workspace">读取中…</dd></dl><p><button data-action="workspace">选择已有项目</button><button data-action="data">打开数据目录</button></p><small>窗口关闭后收起到系统托盘。运行管理与账号切换可从任务栏托盘图标的右键菜单打开。</small></main><script>
'use strict';
document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{if(window.chrome&&window.chrome.webview)window.chrome.webview.postMessage(button.dataset.action);}));
window.renderStatus=value=>{document.querySelector('#qq').textContent=value.qqLoggedIn?'已登录':value.webuiAvailable?'等待扫码登录':'服务未启动';document.querySelector('#bot').textContent=value.botConnected?'已连接 QQ':'尚未连接';document.querySelector('#model').textContent=value.model||'在 NapCat 插件设置中选择';document.querySelector('#workspace').textContent=value.workspace||'';};
</script></body></html>
