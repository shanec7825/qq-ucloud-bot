<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QQ Agent 启动向导</title><link rel="stylesheet" href="style.css"><script>
'use strict';
// Protocol v1 bootstrap: window.renderStatus / window.renderProgress exist before app.js loads (file:// safe).
window.__qqAgentEvents = [];
window.renderStatus = function (value) { window.__qqAgentEvents.push(['status', value]); };
window.renderProgress = function (value) { window.__qqAgentEvents.push(['progress', value]); };
</script></head><body>
<div id="root"></div>
<script src="app.js"></script>
</body></html>
