<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QQ Agent</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf8fd;color:#302b3c;font:15px/1.6 "Microsoft YaHei UI",sans-serif}main{max-width:1000px;padding:48px 42px;margin:auto}.eyebrow{color:#866aa6;letter-spacing:.14em;font-size:12px}h1{font-size:36px;line-height:1.3;margin:10px 0 14px;font-weight:650}p{color:#80728c}.lead{max-width:560px;margin:0 0 28px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.workspace,.entry{border:1px solid #e9e0f0;background:#fff;border-radius:18px;padding:22px}.card small{display:block;color:#8f7b9f;margin-bottom:9px}.card strong{font-size:19px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 34px}button{border:1px solid #dfd2eb;background:#fff;color:#634582;border-radius:10px;padding:13px 20px;font:inherit;cursor:pointer}button:hover{background:#f3ebfa}.primary{background:#73529b;border-color:#73529b;color:#fff}.primary:hover{background:#65448d}.entry h2{font-size:18px;margin:0 0 8px}.entry p{margin:0 0 12px}.workspace{margin-top:18px;font-size:13px;color:#8a7a98}.workspace code{display:block;overflow-wrap:anywhere;color:#6e5a80;margin-top:6px}.hint{font-size:13px;margin-top:24px}.dot{display:inline-block;width:8px;height:8px;background:#3cba89;border-radius:50%;margin-right:8px}@media(max-width:650px){main{padding:28px 20px}.cards{grid-template-columns:1fr}h1{font-size:28px}}
</style></head><body><main><div class="eyebrow">QQ AGENT · WINDOWS</div><h1>你的机器人，随时回来。</h1><p class="lead">登录 QQ、打开设置、查看运行状态，都从这里开始。昵称和模型可自由选择，已有配置会保留。</p><div class="cards"><div class="card"><small>QQ 登录</small><strong id="qq">检查中…</strong></div><div class="card"><small>机器人后台</small><strong id="bot">检查中…</strong></div><div class="card"><small>当前模型</small><strong id="model">尚未读取</strong></div></div><div class="actions"><button class="primary" data-action="login">打开 QQ 登录</button><button data-action="settings">机器人与插件设置</button><button data-action="start">启动机器人</button></div><div class="entry"><h2>关掉窗口后，入口也在</h2><p>右上角关闭按钮会收起到 Windows 托盘。双击托盘图标，或从桌面／开始菜单打开“QQ Agent”，即可回来。</p><button data-action="switch">切换 QQ 账号</button><button data-action="install">首次使用：准备运行组件</button></div><div class="workspace">当前配置工作区<code id="workspace">读取中…</code><p>模型、提示词、群规则和其他服务授权保存在本机。换机器人 QQ 后，重新确认群组与报告接收人。</p></div><p class="hint">首次安装先准备组件，再启动机器人；需要扫码或验证码时请在登录页完成。桌面版不会代替你通过验证。</p></main><script>
for(const button of document.querySelectorAll('[data-action]'))button.onclick=()=>window.chrome.webview.postMessage(button.dataset.action);
window.renderStatus=value=>{document.querySelector('#qq').textContent=value.qqLoggedIn?'已登录':value.webuiAvailable?'等待扫码登录':'服务未启动';document.querySelector('#bot').textContent=value.botConnected?'已连接 QQ':'尚未连接';document.querySelector('#model').textContent=value.model||'在插件设置中选择';document.querySelector('#workspace').textContent=value.workspace||'';};
</script></body></html>
